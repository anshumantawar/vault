# Scaled topology: 2 stateless gateways behind a TCP load balancer, 3 meta (Raft), 6 nodes in 3 zones.
# Every process authenticates with mutual TLS from the `certs` volume; S3 and the UI are HTTPS.
#   VAULT_SECRET_KEY=$(openssl rand -base64 24) docker compose -f deploy/docker-compose.yml up --build
#   S3 → https://localhost:9000 (load-balanced, TLS passthrough)   UI → https://localhost:8080 (gw1)
#   Trust the CA with: docker compose cp certs:/certs/ca.pem ./ca.pem
x-vault: &vault
  build: ..
  restart: unless-stopped
  depends_on:
    certs: { condition: service_completed_successfully }
x-gw-env: &gw-env
  VAULT_ACCESS_KEY: ${VAULT_ACCESS_KEY:-vaultadmin}
  VAULT_SECRET_KEY: ${VAULT_SECRET_KEY:?set VAULT_SECRET_KEY (at least 16 characters)}

services:
  certs:
    build: ..
    command: certs -dir /certs -meta m1,m2,m3 -nodes n1,n2,n3,n4,n5,n6 -gateways gw1,gw2 -hosts lb
    volumes: [certs:/certs]

  m1: { <<: *vault, command: meta -id m1 -grpc 0.0.0.0:7001 -raft m1:7101 -dir /data -tls-dir /certs -peers m1=m1:7101,m2=m2:7101,m3=m3:7101, volumes: [m1:/data, certs:/certs:ro] }
  m2: { <<: *vault, command: meta -id m2 -grpc 0.0.0.0:7001 -raft m2:7101 -dir /data -tls-dir /certs -peers m1=m1:7101,m2=m2:7101,m3=m3:7101, volumes: [m2:/data, certs:/certs:ro] }
  m3: { <<: *vault, command: meta -id m3 -grpc 0.0.0.0:7001 -raft m3:7101 -dir /data -tls-dir /certs -peers m1=m1:7101,m2=m2:7101,m3=m3:7101, volumes: [m3:/data, certs:/certs:ro] }

  n1: { <<: *vault, command: node -id n1 -addr n1:9101 -zone z1 -dir /data -tls-dir /certs -meta m1:7001,m2:7001,m3:7001, volumes: [n1:/data, certs:/certs:ro] }
  n2: { <<: *vault, command: node -id n2 -addr n2:9101 -zone z2 -dir /data -tls-dir /certs -meta m1:7001,m2:7001,m3:7001, volumes: [n2:/data, certs:/certs:ro] }
  n3: { <<: *vault, command: node -id n3 -addr n3:9101 -zone z3 -dir /data -tls-dir /certs -meta m1:7001,m2:7001,m3:7001, volumes: [n3:/data, certs:/certs:ro] }
  n4: { <<: *vault, command: node -id n4 -addr n4:9101 -zone z1 -dir /data -tls-dir /certs -meta m1:7001,m2:7001,m3:7001, volumes: [n4:/data, certs:/certs:ro] }
  n5: { <<: *vault, command: node -id n5 -addr n5:9101 -zone z2 -dir /data -tls-dir /certs -meta m1:7001,m2:7001,m3:7001, volumes: [n5:/data, certs:/certs:ro] }
  n6: { <<: *vault, command: node -id n6 -addr n6:9101 -zone z3 -dir /data -tls-dir /certs -meta m1:7001,m2:7001,m3:7001, volumes: [n6:/data, certs:/certs:ro] }

  gw1: { <<: *vault, environment: *gw-env, command: gateway -id gw1 -s3 0.0.0.0:9000 -ui 0.0.0.0:8080 -tls-dir /certs -meta m1:7001,m2:7001,m3:7001, volumes: [certs:/certs:ro], ports: ["127.0.0.1:8080:8080"] }
  gw2: { <<: *vault, environment: *gw-env, command: gateway -id gw2 -s3 0.0.0.0:9000 -ui "" -tls-dir /certs -meta m1:7001,m2:7001,m3:7001, volumes: [certs:/certs:ro] }

  # TLS passthrough: clients verify the gateways' own certificates, and SigV4's Host header is untouched.
  lb:
    image: nginx:1.27-alpine
    command: [sh, -c, "printf 'events {}\\nstream { upstream s3 { server gw1:9000; server gw2:9000; } server { listen 9000; proxy_pass s3; } }\\n' > /etc/nginx/nginx.conf && exec nginx -g 'daemon off;'"]
    ports: ["127.0.0.1:9000:9000"]
    depends_on: [gw1, gw2]

volumes: { certs: {}, m1: {}, m2: {}, m3: {}, n1: {}, n2: {}, n3: {}, n4: {}, n5: {}, n6: {} }

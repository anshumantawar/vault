<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#e8eefb"/>
      <stop offset="0.5" stop-color="#f1ecf8"/>
      <stop offset="1" stop-color="#fcece2"/>
    </linearGradient>
    <linearGradient id="waveA" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0" stop-color="#7fb0ff"/>
      <stop offset="0.5" stop-color="#b3a1ff"/>
      <stop offset="1" stop-color="#ffb3c7"/>
    </linearGradient>
    <linearGradient id="waveB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffc6a6"/>
      <stop offset="0.55" stop-color="#f7b6d9"/>
      <stop offset="1" stop-color="#a9c4ff"/>
    </linearGradient>
    <linearGradient id="waveC" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b9d4ff"/>
      <stop offset="1" stop-color="#d9c9ff"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
    <filter id="haze" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="90"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>

  <g filter="url(#haze)">
    <circle cx="1260" cy="210" r="260" fill="#c4d6ff" opacity="0.75"/>
    <circle cx="240" cy="240" r="210" fill="#ffdcca" opacity="0.6"/>
    <circle cx="760" cy="120" r="180" fill="#e4d7ff" opacity="0.55"/>
  </g>

  <g filter="url(#soft)">
    <path d="M-120 560 C 220 420, 520 700, 860 560 S 1440 360, 1760 500 L 1760 1120 L -120 1120 Z" fill="url(#waveC)" opacity="0.55"/>
    <path d="M-120 650 C 250 520, 560 800, 900 650 S 1460 470, 1760 600 L 1760 1120 L -120 1120 Z" fill="url(#waveA)" opacity="0.6"/>
    <path d="M-120 790 C 300 680, 640 900, 1000 770 S 1520 650, 1760 740 L 1760 1120 L -120 1120 Z" fill="url(#waveB)" opacity="0.7"/>
  </g>

  <g fill="none" stroke="#ffffff" stroke-linecap="round">
    <path d="M-60 640 C 260 510, 570 780, 900 640 S 1460 460, 1680 580" stroke-opacity="0.55" stroke-width="1.4"/>
    <path d="M-60 668 C 270 540, 580 806, 910 668 S 1470 490, 1680 606" stroke-opacity="0.35" stroke-width="1"/>
    <path d="M-60 696 C 280 570, 590 832, 920 696 S 1480 520, 1680 632" stroke-opacity="0.22" stroke-width="1"/>
    <path d="M-60 800 C 310 700, 650 900, 1010 780 S 1530 670, 1680 740" stroke-opacity="0.4" stroke-width="1.2"/>
  </g>
</svg>
